name: Sync upstream gh-pages
on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00，北京时间周一 08:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout your gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/jaywcjlove/reference.git || true
          git fetch upstream gh-pages

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse FETCH_HEAD)
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Force sync from upstream if updated
        if: steps.check.outputs.has_update == 'true'
        run: |
          git reset --hard FETCH_HEAD
          git push origin gh-pages --force
